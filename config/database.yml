default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  username: <%= ENV.fetch("DATABASE_USER") { "postgres" } %>
  password: <%= ENV.fetch("DATABASE_PASSWORD") { "" } %>

development:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { "slotwise_dev" } %>

test:
  <<: *default
  database: <%= ENV.fetch("DATABASE_NAME") { "slotwise_test" } %>

production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>
