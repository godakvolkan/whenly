pending_booking:
  user: one
  event_type: one
  invitee_name: "Ahmet Yılmaz"
  invitee_email: "ahmet@example.com"
  starts_at: <%= 2.days.from_now.change(hour: 10, min: 0) %>
  ends_at: <%= 2.days.from_now.change(hour: 10, min: 30) %>
  status: "pending"
  approval_deadline_at: <%= 1.day.from_now %>
  token: "fixture_token_pending"

confirmed_booking:
  user: one
  event_type: one
  invitee_name: "Mehmet Demir"
  invitee_email: "mehmet@example.com"
  starts_at: <%= 3.days.from_now.change(hour: 14, min: 0) %>
  ends_at: <%= 3.days.from_now.change(hour: 14, min: 30) %>
  status: "confirmed"
  approval_deadline_at: <%= 2.days.from_now %>
  token: "fixture_token_confirmed"
