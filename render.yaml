services:
  - type: web
    name: whenly
    runtime: ruby
    region: frankfurt
    plan: free
    buildCommand: bash bin/render-build.sh
    startCommand: bundle exec rails server -b 0.0.0.0 -p $PORT
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: FORCE_SSL
        value: "false"
      - key: ASSUME_SSL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: whenly-db
          property: connectionString

databases:
  - name: whenly-db
    region: frankfurt
    plan: free
