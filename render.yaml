services:
  - type: web
    name: slotwise
    runtime: ruby
    plan: free
    buildCommand: bundle install; bin/rails db:migrate
    startCommand: bin/rails server -b 0.0.0.0 -p $PORT
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: slotwise-db
          property: connectionString

databases:
  - name: slotwise-db
    plan: free
