services:
  - type: web
    name: whenly
    runtime: ruby
    plan: free
    buildCommand: bundle install && bundle exec rails assets:precompile
    startCommand: bundle exec rails db:prepare && bundle exec rails db:seed && bundle exec rails server -b 0.0.0.0 -p $PORT
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: FORCE_SSL
        value: "false"
      - key: ASSUME_SSL
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: whenly-db
          property: connectionString

databases:
  - name: whenly-db
    plan: free
