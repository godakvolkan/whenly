services:
  - type: web
    name: whenly
    runtime: ruby
    region: frankfurt
    plan: free
    buildCommand: bash bin/render-build.sh
    startCommand: bundle exec rails server -b 0.0.0.0 -p $PORT
    healthCheckPath: /up
    envVars:
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: FORCE_SSL
        value: "false"
      - key: ASSUME_SSL
        value: "false"
      # Mevcut ücretsiz veritabanının (whenly-db) Internal Database URL'i elle girilir.
      - key: DATABASE_URL
        sync: false
      - key: APP_HOST
        value: whenly-cpyy.onrender.com
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
